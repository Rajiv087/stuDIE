<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-5</title>
</head>
<script>
    let today = new Date();
    let dayNumber = today.getDay();
    let dayName;
    switch(dayNumber) {
        case 0: 
        dayName = "Sunday";
        break;
        
        case 1: 
        dayName = "Monday";
        break;

        case 2: 
        dayName = "Tuesday";
        break;

        case 3: 
        dayName = "Wednesday";
        break;

        case 4: 
        dayName = "Thursday";
        break;

        case 5: 
        dayName = "Friday";
        break;

        case 6: 
        dayName = "Saturday";
        break;
    }
    document.write("Today is " + dayName);
</script>

</html>
