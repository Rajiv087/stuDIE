    <!-- Name, email, phone, message, subject, subscribe, submit -->
    <h1 style="text-align: center;">Contact Me</h1>
    <form action="Thank.html">
        <div>
            <label for="Name">Name: </label>
            <input type="text" id="Name" placeholder="Enter your name: ">
            <br>
        </div> <br>

        <div>
            <label for="E-mail">Email:</label>
            <input type="email" id="email" placeholder="Enter your e-mail: ">
        </div>
        <br>

        <div>
            <label for="Phone">Phone: </label>
            <input type="tel" id="Phone" placeholder="Enter your mobile Number: ">
        </div> <br>

        <div>
            <label for="Message">Message: </label>
            <textarea name="Message" id="Message" placeholder="Enter your message: "></textarea>
        </div> <br>

        <div>
            <label for="Subject">Subject: </label>
            <select name="Subject" id="Subject">
                <option value="Work">You have some Work for me</option>
                <option value="Talk">You just wanna talk</option>
                <option value="none" selected>none</option>
            </select> 
        </div> <br>

        <div>
            <label for="checkbox">Subscribe</label>
            <input type="checkbox" id="Subscribe"> 
        </div><br>

        <div style="text-align: center;">
            <button>SUMBIT</button>
        </div>
    </form>
